<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentLight Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d0d0d;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }
  .demo-badge {
    font-size: 11px;
    padding: 4px 10px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 20px;
    color: #555;
    letter-spacing: 1px;
  }
  #light {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: #2a2a2a;
    box-shadow: 0 0 30px 8px rgba(50,50,50,0.4);
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }
  #state-label {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    transition: color 0.4s ease;
  }
  #info { font-size: 12px; color: #444; letter-spacing: 1px; }
  h1 {
    font-size: 13px; font-weight: 400; color: #444;
    letter-spacing: 3px; text-transform: uppercase;
  }

  /* idle — green (solid) */
  .state-idle { background: #22c55e !important; box-shadow: 0 0 50px 18px rgba(34,197,94,0.55) !important; }
  .state-idle-label { color: #22c55e !important; }

  /* working — amber (pulse) */
  .state-working { background: #f59e0b !important; box-shadow: 0 0 50px 20px rgba(245,158,11,0.6) !important; animation: pulse 1s ease-in-out infinite; }
  .state-working-label { color: #f59e0b !important; }

  /* confirm — blue (pulse) */
  .state-confirm { background: #3b82f6 !important; box-shadow: 0 0 50px 20px rgba(59,130,246,0.6) !important; animation: pulse 1.5s ease-in-out infinite; }
  .state-confirm-label { color: #3b82f6 !important; }

  /* error — red (pulse) */
  .state-error { background: #ef4444 !important; box-shadow: 0 0 50px 20px rgba(239,68,68,0.6) !important; animation: pulse 0.8s ease-in-out infinite; }
  .state-error-label { color: #ef4444 !important; }

  /* offline — gray (off) */
  .state-offline { background: #1e1e1e !important; box-shadow: 0 0 20px 4px rgba(40,40,40,0.5) !important; }
  .state-offline-label { color: #555 !important; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.07); }
  }
</style>
</head>
<body>

  <span class="demo-badge">DEMO MODE</span>

  <div id="light"></div>
  <div id="state-label">LOADING</div>
  <div id="info">—</div>

  <h1>AgentLight Demo</h1>

<script>
// Poll the local AgentLight hub directly (no state file needed).
const HUB = 'http://localhost:9527/state';
const KNOWN = ['idle', 'working', 'confirm', 'error', 'offline'];

function applyState(s, source, detail) {
  var light = document.getElementById('light');
  var label = document.getElementById('state-label');
  var info  = document.getElementById('info');

  if (KNOWN.indexOf(s) === -1) s = 'idle';
  light.className = '';
  label.className = '';
  light.classList.add('state-' + s);
  label.classList.add('state-' + s + '-label');
  label.textContent = s.toUpperCase();

  var parts = [];
  if (source) parts.push(source);
  if (detail) parts.push(detail);
  info.textContent = parts.length ? parts.join('  ·  ') : '—';
}

function update() {
  fetch(HUB + '?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var s = (data.state || 'offline').toLowerCase();
      applyState(s, data.source, data.detail);
    })
    .catch(function() {
      // Hub not running — show offline.
      applyState('offline', null, 'hub offline');
    });
}

applyState('offline', null, null);
update();
setInterval(update, 500);
</script>
</body>
</html>
