# AgentLight - Codex hooks
#
# Verified with Codex v0.135.0-alpha.1 on macOS.
# Merge this block into ~/.codex/config.toml. Do not replace the file, and do
# not remove an existing `notify = [...]` setting.
#
# The command hooks are reviewed by Codex before they run. After installing or
# changing this block, open Codex and choose "Trust all and continue" when the
# "Hooks need review" prompt appears, or run `/hooks` in the Codex TUI.

[[hooks.SessionStart]]
matcher = ".*"

[[hooks.SessionStart.hooks]]
type = "command"
command = "sh -c '${CODEX_HOME:-$HOME/.codex}/hooks/agentlight-state.sh idle'"
timeout = 2
statusMessage = "AgentLight idle"

[[hooks.UserPromptSubmit]]
matcher = ".*"

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "sh -c '${CODEX_HOME:-$HOME/.codex}/hooks/agentlight-state.sh working'"
timeout = 2
statusMessage = "AgentLight working"

[[hooks.PreToolUse]]
matcher = ".*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "sh -c '${CODEX_HOME:-$HOME/.codex}/hooks/agentlight-state.sh working'"
timeout = 2
statusMessage = "AgentLight working"

[[hooks.PermissionRequest]]
matcher = ".*"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = "sh -c '${CODEX_HOME:-$HOME/.codex}/hooks/agentlight-state.sh confirm'"
timeout = 2
statusMessage = "AgentLight confirm"

[[hooks.PostToolUse]]
matcher = ".*"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "sh -c '${CODEX_HOME:-$HOME/.codex}/hooks/agentlight-state.sh working'"
timeout = 2
statusMessage = "AgentLight working"

[[hooks.Stop]]
matcher = ".*"

[[hooks.Stop.hooks]]
type = "command"
command = "sh -c '${CODEX_HOME:-$HOME/.codex}/hooks/agentlight-state.sh idle'"
timeout = 2
statusMessage = "AgentLight idle"
