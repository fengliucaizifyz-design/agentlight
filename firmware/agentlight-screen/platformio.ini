; AgentLight — screen firmware (Pro Max output device)
; Build/flash with PlatformIO:  pio run -t upload && pio device monitor
;
; The TFT_eSPI pin map is passed as build_flags here so we never hand-edit the
; library's User_Setup.h — the whole config is reproducible from this file.

[platformio]
src_dir = .

[env:agentlight-screen]
; Pinned: TFT_eSPI 2.5.43 pokes ESP32 SPI registers directly and computes a
; null base on newer IDF (espressif32 7.x) -> boot crash in begin_tft_write.
; 6.9.0 = Arduino core 2.0.17 + IDF 4.4, the combo TFT_eSPI targets. Pinning
; also makes the product build reproducible.
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.2.0
    https://github.com/tzapu/WiFiManager.git

build_flags =
    ; ---- USB serial ----
    ; Route Arduino `Serial` to the USB-Serial/JTAG (HWCDC, the same port used
    ; for flashing) instead of UART0, so the agent can talk to the device over
    ; USB during setup. Board already sets ARDUINO_USB_MODE=1 (HWCDC).
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; ---- TFT_eSPI panel config (GMT154-04 / ST7789 240x240, SPI) ----
    -D USER_SETUP_LOADED=1
    ; Force the SPI3/HSPI port. The S3 default (FSPI) makes TFT_eSPI compute a
    ; null SPI register base on this IDF -> StoreProhibited crash in tft.init().
    -D USE_HSPI_PORT=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    ; ---- pin map: from the box's official schematic (S3 weather board) ----
    -D TFT_MOSI=1         ; LCD_SDA
    -D TFT_SCLK=18        ; LCD_SCL
    ; No TFT_CS: chip-select is tied low inside the panel (not on the FPC).
    ; Omitting it makes TFT_eSPI's CS_L/CS_H no-ops (the correct behaviour).
    -D TFT_DC=17          ; LCD_DC
    -D TFT_RST=6          ; LCD_RESET
    -D TFT_BL=2           ; LCD_BL -> P-MOSFET (AO3401) high-side switch
    -D TFT_BACKLIGHT_ON=0 ; ACTIVE-LOW: gate low -> P-MOSFET on -> backlight on
    ; ---- fonts used by the setup screen ----
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    ; ---- TUNING KNOBS (flip these first if the picture looks wrong) ----
    ; Colours inverted (whites look black)? comment this line out:
    -D TFT_INVERSION_ON=1
    ; Image mirrored / rotated / 1-2px shifted? change setRotation() in the .ino.
